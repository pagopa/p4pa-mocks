openapi: 3.0.3
info:
  title: Mock configuration api
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  "/config/cie/test-issuer":
    post:
      tags:
        - CIE Mock Configuration
      operationId: includeCieTestOrganization
      description: >
        Enable or disable the inclusion of the "Comune di Test" (CF: 11111111111)
        in the list of issuers returned by the CIE service.
        When set to true, the mock data will include the test organization.
      parameters:
        - name: include
          in: query
          required: true
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: OK
        "400":
          description: Invalid request
