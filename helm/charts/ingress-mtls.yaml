{{- define "mtls-ingress-host" }}
{{- .Values.microservice-chart.ingress.host | replace "hub" "hub-mtls" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: p4pa-mocks-mtls
  namespace: {{ .Values.microservice-chart.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: true
    nginx.ingress.kubernetes.io/rewrite-target: {{ .Values.microservice-chart.ingress.rewriteTarget }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ include "mtls-ingress-host" . }}
      http:
        paths:
          - backend:
              service:
                name: p4pa-mocks
                port:
                  number: {{ .Values.microservice-chart.ingress.servicePort }}
            path: {{ .Values.microservice-chart.ingress.path }}
            pathType: {{ .Values.microservice-chart.ingress.pathType }}
  tls:
    - hosts: {{ include "mtls-ingress-host" . }}
      secretName: {{ include "mtls-ingress-host" . | replace "." "-" }}
